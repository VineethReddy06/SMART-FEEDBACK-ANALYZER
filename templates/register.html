<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Account - Smart Feedback AI</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>


<body>

    <!-- ================= NAVBAR ================= -->

    <header class="navbar">

        <a href="/" class="logo">
            Smart Feedback AI
        </a>

        <nav>

            <a href="/">
                Home
            </a>

            <a href="/login">
                Login
            </a>

        </nav>

    </header>


    <!-- ================= REGISTER ================= -->

    <main class="auth-container">

        <div class="auth-card">

            <!-- ICON -->

            <div class="auth-icon">
                🚀
            </div>


            <h1>
                Create Your Account
            </h1>

            <p>
                Join Smart Feedback AI and start sharing
                valuable feedback.
            </p>


            <form id="registerForm"
                  class="auth-form">


                <!-- NAME -->

                <div>

                    <label for="name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="name"
                        placeholder="Enter your full name"
                        autocomplete="name"
                        required
                    >

                </div>


                <!-- EMAIL -->

                <div>

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div>

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Create a password"
                        autocomplete="new-password"
                        required
                    >

                </div>


                <!-- REGISTER BUTTON -->

                <button
                    type="submit"
                    class="login-btn">

                    Create Account →

                </button>


                <!-- MESSAGE -->

                <p
                    id="registerMessage"
                    class="message">
                </p>

            </form>


            <!-- LOGIN -->

            <div class="auth-footer">

                <span>
                    Already have an account?
                </span>

                <a href="/login">
                    Sign In
                </a>

            </div>


            <!-- HOME -->

            <a href="/"
               class="back-home">

                ← Back to Home

            </a>

        </div>

    </main>


    <!-- ================= FOOTER ================= -->

    <footer class="site-footer">

        <p>
            © 2026 Smart Feedback AI
        </p>

        <p>
            AI-powered feedback management system
        </p>

    </footer>


    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>
