<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Smart Feedback AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="auth-container">
        <div class="auth-card">
            <h1>Forgot Password</h1>
            <p>Enter your account email and we will send a reset link.</p>
            <form id="forgotPasswordForm" class="auth-form">
                <label for="forgotEmail">Email Address</label>
                <input type="email" id="forgotEmail" required autocomplete="email">
                <button type="submit" class="login-btn">Send Reset Link</button>
                <p id="forgotMessage" class="message"></p>
            </form>
            <a href="/login" class="back-home">← Back to Login</a>
        </div>
    </main>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
