<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Smart Feedback AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="auth-container">
        <div class="auth-card">
            {% if invalid_token %}
                <h1>Invalid Reset Link</h1>
                <p>This link is invalid or expired.</p>
                <a href="/forgot-password" class="back-home">Request a new link</a>
            {% else %}
                <h1>Set New Password</h1>
                <form id="resetPasswordForm" class="auth-form" data-token="{{ token }}">
                    <label for="newPassword">New Password</label>
                    <input type="password" id="newPassword" required minlength="6"
                           autocomplete="new-password">
                    <button type="submit" class="login-btn">Reset Password</button>
                    <p id="resetMessage" class="message"></p>
                </form>
            {% endif %}
        </div>
    </main>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
